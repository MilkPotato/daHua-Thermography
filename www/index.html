<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大华热像仪 · 实时预览</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b212c; --line:#252c3a;
    --fg:#e6ebf2; --dim:#8b97a8; --accent:#38bdf8; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; white-space:nowrap}

  .pill{
    display:inline-flex; align-items:center; gap:7px;
    padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600;
    background:var(--panel2); border:1px solid var(--line); color:var(--dim);
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pill.live{color:#bbf7d0; border-color:#14532d; background:#0d2818}
  .pill.live .dot{background:var(--ok); box-shadow:0 0 0 0 rgba(34,197,94,.7); animation:pulse 1.8s infinite}
  .pill.off{color:#fecaca; border-color:#7f1d1d; background:#2a0f0f}
  .pill.off .dot{background:var(--bad)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}
    70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
  }

  .stats{display:flex; gap:18px; margin-left:auto; flex-wrap:wrap}
  .stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25}
  .stat .k{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px}
  .stat .v{font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:16px; min-height:0}
  .stage{
    position:relative; max-width:100%; max-height:100%;
    background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    line-height:0;
  }
  #video{display:block; max-width:100%; max-height:calc(100vh - 190px); width:auto; height:auto}
  .stage:fullscreen{border-radius:0; border:none; display:flex; align-items:center; justify-content:center}
  .stage:fullscreen #video{max-height:100vh; max-width:100vw}

  .overlay{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(6,9,14,.86); color:var(--dim); text-align:center; padding:24px;
    line-height:1.6;
  }
  .overlay.show{display:flex}
  .spinner{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay .err{color:var(--bad); font-size:12px; max-width:520px; word-break:break-all}

  footer{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; background:var(--panel); border-top:1px solid var(--line);
  }
  button{
    font:inherit; font-size:13px; font-weight:500;
    padding:7px 15px; border-radius:8px; cursor:pointer;
    background:var(--panel2); color:var(--fg);
    border:1px solid var(--line); transition:.15s;
  }
  button:hover{background:#232b38; border-color:#33405a}
  button:active{transform:translateY(1px)}
  button.primary{background:#0c4a6e; border-color:#0e7490; color:#e0f2fe}
  button.primary:hover{background:#0e5f88}
  .spacer{margin-left:auto}
  .hint{font-size:12px; color:var(--dim)}
  .hint code{background:var(--panel2); padding:2px 6px; border-radius:4px; font-size:11px}

  /* ---------- 有损往返实验 ---------- */
  .modal{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(3,6,10,.84)}
  .modal.show{display:flex}
  .modal-card{
    width:min(1180px,96vw); max-height:94vh; display:flex; flex-direction:column; gap:12px;
    padding:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; box-shadow:0 24px 70px rgba(0,0,0,.65); line-height:1.5;
  }
  .modal-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .modal-head h2{font-size:16px; margin:0; font-weight:600}
  .modal-head .spacer{margin-left:auto}
  .modal-close{background:none; border:none; color:var(--dim); font-size:22px; line-height:1; padding:2px 8px; cursor:pointer; border-radius:6px}
  .modal-close:hover{color:var(--fg); background:var(--panel2)}
  .rt-metrics{display:flex; gap:10px; flex-wrap:wrap}
  .rt-metric{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:118px}
  .rt-metric .k{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px}
  .rt-metric .v{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
  .rt-verdict{flex:1; min-width:280px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--dim)}
  .rt-verdict b{color:var(--fg); font-weight:600}
  .rt-tabs{display:flex; gap:8px; flex-wrap:wrap}
  .rt-tabs button{font-size:12px; padding:6px 12px}
  .rt-tabs button.active{background:#0c4a6e; border-color:#0e7490; color:#e0f2fe}
  .rt-tabs button.active:hover{background:#0e5f88}
  .rt-imgwrap{flex:1; min-height:240px; display:flex; align-items:center; justify-content:center; background:#000; border:1px solid var(--line); border-radius:8px; overflow:hidden; line-height:0}
  #rtImg{display:block; width:100%; height:56vh; object-fit:contain}
  #rtImg.pixelated{image-rendering:pixelated; image-rendering:crisp-edges}
  .rt-note{font-size:12px; color:var(--dim)}
  .rt-note code{background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:11px}
</style>
</head>
<body>

<header>
  <h1>大华热像仪 · 实时预览</h1>
  <span class="pill off" id="pill"><span class="dot"></span><span id="pillText">连接中…</span></span>

  <div class="stats">
    <div class="stat"><span class="k">帧率</span><span class="v" id="fps">—</span></div>
    <div class="stat"><span class="k">分辨率</span><span class="v" id="res">—</span></div>
    <div class="stat"><span class="k">已播</span><span class="v" id="uptime">—</span></div>
    <div class="stat"><span class="k">重连</span><span class="v" id="recon">0</span></div>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <img id="video" alt="热像仪实时画面">
    <div class="overlay show" id="overlay">
      <div class="spinner" id="spinner"></div>
      <div id="ovText">正在连接摄像头…</div>
      <div class="err" id="ovErr"></div>
    </div>
  </div>
</main>

<footer>
  <button class="primary" id="btnShot" title="保存摄像头原始 1280×960 快照（含清晰温度读数）">截图保存</button>
  <button id="btnRoundTrip" title="把 1280×960 降到 256×192 再放大回来，量化画面里有多少真实细节">有损往返实验</button>
  <button id="btnFull">全屏</button>
  <button id="btnReload">重连</button>
  <span class="spacer"></span>
  <span class="hint">直连 <code id="streamUrl"></code></span>
</footer>

<!-- 有损往返实验 -->
<div class="modal" id="rtModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>有损往返实验</h2>
      <span class="hint" id="rtTime"></span>
      <span class="spacer"></span>
      <button id="rtRerun">重新测试</button>
      <button class="modal-close" id="rtClose" title="关闭">×</button>
    </div>

    <div class="rt-metrics">
      <div class="rt-metric"><div class="k">PSNR (Y)</div><div class="v" id="rtPsnr">—</div></div>
      <div class="rt-metric"><div class="k">SSIM (8×8)</div><div class="v" id="rtSsim">—</div></div>
      <div class="rt-metric"><div class="k">往返路径</div><div class="v" id="rtPath">—</div></div>
      <div class="rt-metric"><div class="k">处理耗时</div><div class="v" id="rtElapsed">—</div></div>
      <div class="rt-verdict" id="rtVerdict">正在准备…</div>
    </div>

    <div class="rt-tabs" id="rtTabs">
      <button data-view="original" class="active">相机原图 1280×960</button>
      <button data-view="low">原始 256×192 像素</button>
      <button data-view="recon">5× 往返重建 1280×960</button>
    </div>

    <div class="rt-imgwrap"><img id="rtImg" alt="有损往返实验结果"></div>
    <div class="rt-note" id="rtViewNote"></div>
    <div class="rt-note" id="rtNote"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var video   = document.getElementById('video');
  var overlay = document.getElementById('overlay');
  var spinner = document.getElementById('spinner');
  var ovText  = document.getElementById('ovText');
  var ovErr   = document.getElementById('ovErr');
  var pill    = document.getElementById('pill');
  var pillText= document.getElementById('pillText');
  var elFps   = document.getElementById('fps');
  var elRes   = document.getElementById('res');
  var elUp    = document.getElementById('uptime');
  var elRecon = document.getElementById('recon');
  var stage   = document.getElementById('stage');

  document.getElementById('streamUrl').textContent = location.host + '/stream';

  // ---------- 直播流 ----------
  var retryTimer = null;
  var retrying = false;

  function startStream(){
    // 加时间戳避免浏览器复用旧连接
    video.src = '/stream?t=' + Date.now();
  }

  video.onload = function(){
    // 收到第一帧
    overlay.classList.remove('show');
  };
  video.onerror = function(){
    overlay.classList.add('show');
    spinner.style.display = 'block';
    ovText.textContent = '连接中断，正在重连…';
    scheduleRetry();
  };

  function scheduleRetry(){
    if (retrying) return;
    retrying = true;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function(){
      retrying = false;
      startStream();
    }, 2000);
  }

  document.getElementById('btnReload').onclick = function(){
    clearTimeout(retryTimer);
    retrying = false;
    overlay.classList.add('show');
    spinner.style.display = 'block';
    ovText.textContent = '正在重新连接…';
    ovErr.textContent = '';
    video.src = '';
    setTimeout(startStream, 250);
  };

  // ---------- 截图 ----------
  document.getElementById('btnShot').onclick = function(){
    // 直接下服务端的快照接口，拿的是原始 JPEG，不是屏幕截图
    var a = document.createElement('a');
    a.href = '/snapshot.jpg?_=' + Date.now();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  // ---------- 全屏 ----------
  document.getElementById('btnFull').onclick = function(){
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (stage.requestFullscreen) {
      stage.requestFullscreen();
    }
  };

  // ---------- 有损往返实验 ----------
  var rtModal    = document.getElementById('rtModal');
  var rtImg      = document.getElementById('rtImg');
  var rtTabs     = document.getElementById('rtTabs');
  var rtPsnr     = document.getElementById('rtPsnr');
  var rtSsim     = document.getElementById('rtSsim');
  var rtPath     = document.getElementById('rtPath');
  var rtElapsed  = document.getElementById('rtElapsed');
  var rtVerdict  = document.getElementById('rtVerdict');
  var rtTime     = document.getElementById('rtTime');
  var rtViewNote = document.getElementById('rtViewNote');
  var rtNote     = document.getElementById('rtNote');
  var rtData     = null;
  var rtView     = location.hash.indexOf('/low') >= 0 ? 'low'
                 : location.hash.indexOf('/recon') >= 0 ? 'recon'
                 : 'original';

  var RT_VIEW_NOTES = {
    original: '相机输出的 1280×960 原图（snapshot.cgi 原生 JPEG）。',
    low: '由原图双三次降采样得到的 256×192 图像。这里用最近邻放大显示，方便直接看到真实像素块——它代表这帧画面能提供的空间信息上限。',
    recon: '把 256×192 图像双三次放大回 1280×960。与「相机原图」比较就得到上面的 PSNR / SSIM。'
  };

  function kb(n){
    if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
    return Math.round(n / 1024) + ' KB';
  }

  function setRtView(v){
    rtView = v;
    var buttons = rtTabs.getElementsByTagName('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].className = buttons[i].getAttribute('data-view') === v ? 'active' : '';
    }
    var url = v === 'original' ? '/roundtrip/original.jpg'
            : v === 'low'      ? '/roundtrip/lowres.png'
            :                    '/roundtrip/upscaled.jpg';
    rtImg.className = v === 'low' ? 'pixelated' : '';
    rtImg.src = url + '?t=' + Date.now();
    rtViewNote.textContent = RT_VIEW_NOTES[v] || '';
  }

  function runRoundTrip(){
    rtData = null;
    rtPsnr.textContent = '—';
    rtSsim.textContent = '—';
    rtPath.textContent = '—';
    rtElapsed.textContent = '—';
    rtTime.textContent = '';
    rtViewNote.textContent = '';
    rtNote.innerHTML = '';
    rtVerdict.textContent = '正在抓取快照、降采样、放大并计算 PSNR/SSIM…';

    fetch('/roundtrip?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) {
          rtVerdict.textContent = '实验失败：' + ((d && d.error) || '未知错误');
          return;
        }
        rtData = d;
        rtPsnr.textContent = d.psnr.toFixed(2) + ' dB';
        rtSsim.textContent = d.ssim.toFixed(4);
        rtPath.textContent = d.width + '×' + d.height + ' → ' + d.lowWidth + '×' + d.lowHeight;
        rtElapsed.textContent = d.elapsedMs + ' ms';
        rtTime.textContent = '测试于 ' + d.at;

        var verdict;
        if (d.psnr >= 34 && d.ssim >= 0.95) {
          verdict = '<b>几乎没有超过 256×192 的真实细节。</b> 降采样再放大后画面仍高度一致，说明 1280×960 主要是插值放大；最锐利的高频信息来自 OSD 文字和温度标注。';
        } else if (d.psnr >= 28 && d.ssim >= 0.90) {
          verdict = '<b>大部分内容可以由 256×192 重建。</b> 往返后有一定损失，主要来自 OSD 文字和边缘，热图本身仍以低分辨率信息为主。';
        } else {
          verdict = '<b>往返后损失明显。</b> 画面中存在较多高于 256×192 的真实细节，或本次快照中 OSD / 纹理占比很高。';
        }
        rtVerdict.innerHTML = verdict + '<br>PSNR 越高、SSIM 越接近 1，表示往返重建越接近原图。';
        rtNote.innerHTML = '路径：<code>' + d.width + '×' + d.height +
          '</code> → 双三次降采样 <code>' + d.lowWidth + '×' + d.lowHeight +
          '</code> → 双三次放大回 <code>' + d.width + '×' + d.height +
          '</code>。文件大小：原始 JPEG ' + kb(d.originalBytes) +
          '，256×192 PNG ' + kb(d.lowBytes) +
          '，重建 JPEG ' + kb(d.reconBytes) + '。';

        setRtView(rtView);
      })
      .catch(function(e){
        rtVerdict.textContent = '实验失败：' + e;
      });
  }

  document.getElementById('btnRoundTrip').onclick = function(){
    rtModal.classList.add('show');
    runRoundTrip();
  };
  document.getElementById('rtRerun').onclick = runRoundTrip;
  document.getElementById('rtClose').onclick = function(){ rtModal.classList.remove('show'); };
  rtModal.onclick = function(e){ if (e.target === rtModal) rtModal.classList.remove('show'); };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') rtModal.classList.remove('show');
  });
  rtTabs.onclick = function(e){
    var b = e.target;
    while (b && b !== rtTabs && b.tagName !== 'BUTTON') b = b.parentNode;
    if (!b || b === rtTabs) return;
    setRtView(b.getAttribute('data-view'));
  };

  // 支持直接打开实验面板：/#roundtrip、/#roundtrip/low、/#roundtrip/recon
  if (location.hash.indexOf('#roundtrip') === 0) {
    rtModal.classList.add('show');
    runRoundTrip();
  }

  // ---------- 状态轮询 ----------
  function fmtDur(s){
    s = Math.floor(s);
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
    function p(n){ return n<10 ? '0'+n : ''+n; }
    return h > 0 ? (h+':'+p(m)+':'+p(ss)) : (m+':'+p(ss));
  }

  function poll(){
    fetch('/status', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(s){
        if (s.online) {
          pill.className = 'pill live';
          pillText.textContent = '在线';
        } else {
          pill.className = 'pill off';
          pillText.textContent = '离线';
        }
        elFps.textContent = s.online ? (s.fps.toFixed(1) + ' fps') : '—';
        elRes.textContent = s.width ? (s.width + '×' + s.height) : '—';
        elUp.textContent  = s.online ? fmtDur(s.onlineSeconds) : '—';
        elRecon.textContent = s.reconnects;

        if (!s.online) {
          overlay.classList.add('show');
          spinner.style.display = 'block';
          ovText.textContent = '摄像头离线，正在自动重连…';
          ovErr.textContent = s.lastError || '';
        }
      })
      .catch(function(){ /* 服务本身没起来，忽略 */ });
  }

  startStream();
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
